# 立直麻将读牌应用 - 配置文件示例
# 复制此文件为 config.ini 并修改相应配置

[Database]
# 数据库文件路径（可放在项目外以减轻 Cursor 内存占用，例如 E:\Cursor\Tenhou data\data\tenhou.db）
path = E:\Cursor\Tenhou data\data\tenhou.db

[Download]
# 数据下载起始年份
start_year = 2020

# 是否只下载四人麻（true/false）
four_player_only = true

# 默认样本数量限制
default_sample_limit = 10000

[Query]
# 默认巡目范围
default_turn_min = 2
default_turn_max = 10

# 是否启用查询缓存
enable_cache = false

# 缓存大小（条目数）
cache_size = 100

[Logging]
# 日志级别 (DEBUG, INFO, WARNING, ERROR, CRITICAL)
level = INFO

# 日志文件路径
file = tenhou_handreading.log

# 是否同时输出到控制台
console = true

[GUI]
# 窗口宽度
window_width = 800

# 窗口高度
window_height = 700

# 字体大小
font_size = 10

# 主题 (light/dark)
theme = light
